<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passtelacare - Blank Pages Test</title>
  <style>
    @page { size: A4; margin: 0; }
    body { font-family: Arial, sans-serif; background: #555; margin: 0; padding: 20px 0; color: #000; }
    
    .page {
      width: 794px;
      min-height: 1123px;
      margin: 0 auto 25px auto;
      background: #fff;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header-img-container { 
      width: 100%; 
      text-align: center; 
    }
    .header-img-container img { width: 100%; height: auto; display: block; }

    .footer-img-container { width: 100%; position: relative; }
    .footer-img-container img { width: 100%; height: auto; display: block; }

    .page-body {
      padding: 15px 50px;
      flex-grow: 1;
      text-align: center;
      color: #888;
      font-size: 18px;
    }

    .page-number {
      text-align: right;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 20px 8px 0;
      color: #000;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- PAGE 1 OF 5 -->

    <div style="height: 40px;"></div>
    <div class="header-img-container"><img src="NEWHEADER.png" alt="Header"></div>
